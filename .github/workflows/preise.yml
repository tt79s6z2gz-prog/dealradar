name: DealRadar Preise alle 30 Minuten prüfen

on:
  schedule:
    - cron: '*/30 6-23 * * *'
      timezone: 'Europe/Berlin'
  push:
    branches: [main]
    paths:
      - 'produkte.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dealradar-repo-write
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Aktuellen Katalog laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: ALLE hinterlegten Angebote prüfen und Preisverlauf aktualisieren
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py
      - name: Neues Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m "DealRadar: alle Preisquellen aktualisiert"
            git push
          fi
