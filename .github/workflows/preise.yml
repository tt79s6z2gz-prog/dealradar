name: Preise prüfen (Europe/Berlin)
on:
  schedule:
    - cron: '0 6,9,12,15,18,21 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dealradar-preispruefung
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Preise prüfen, optional Telegram senden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py
      - name: Preisverlauf speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Preisprüfung aktualisiert"
            git push
          fi
