name: DealRadar Preise alle 30 Minuten prüfen

on:
  schedule:
    - cron: '*/30 6-23 * * *'
      timezone: 'Europe/Berlin'
  push:
    branches: [main]
    paths:
      - 'produkte.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dealradar-repo-write
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Alle Produkte prüfen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py
      - name: Scan-Ergebnis gegen konkurrierende GitHub-Änderungen sichern
        run: cp docs/data/prices.json "$RUNNER_TEMP/dealradar-scan.json"
      - name: Preisverlauf speichern, bei Push-Konflikten wiederholen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "Speicherversuch $attempt von 5"
            git fetch origin main
            git reset --hard origin/main
            python merge_scan.py "$RUNNER_TEMP/dealradar-scan.json" docs/data/prices.json produkte.json
            git add docs/data/prices.json
            if git diff --cached --quiet; then
              echo "Ergebnis bereits gespeichert."
              exit 0
            fi
            git commit -m "DealRadar: Preisprüfung gespeichert"
            if git push origin HEAD:main; then
              echo "Ergebnis erfolgreich gespeichert."
              exit 0
            fi
            echo "Zwischenzeitliche Änderung erkannt; Daten werden neu zusammengeführt."
            sleep 3
          done
          echo "Preisverlauf nach 5 Versuchen nicht speicherbar." >&2
          exit 1
